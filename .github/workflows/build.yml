name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip
        id: unzip
        run: |
          unzip -q -o *.zip -d project
          D=$(dirname "$(find project -name 'settings.gradle*' | head -n 1)")
          echo "dir=$D" >> $GITHUB_OUTPUT
          V=$(grep distributionUrl "$D/gradle/wrapper/gradle-wrapper.properties" | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')
          echo "ver=${V:-8.7}" >> $GITHUB_OUTPUT
      - name: Fix setLang clash
        run: |
          F=$(find project -name MaveViewModel.kt | head -n 1)
          sed -i 's/^\([[:space:]]*\)fun setLang(/\1@JvmName("setLangValue") fun setLang(/' "$F"
          grep -n "setLang" "$F"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.unzip.outputs.ver }}
      - name: Build
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/build/outputs/apk/debug/*.apk
