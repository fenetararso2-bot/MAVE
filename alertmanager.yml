# Alertmanager template: routes the alerts in ops/alerts.yml to e-mail. Replace every CHANGE_ME value.
# Template: validate with `amtool check-config ops/alertmanager.yml` before use (not run in CI).
global:
  smtp_smarthost: "smtp.example.org:587"      # CHANGE_ME
  smtp_from: "alerts@example.org"             # CHANGE_ME
  smtp_auth_username: "alerts@example.org"    # CHANGE_ME
  smtp_auth_password_file: /etc/alertmanager/smtp_password   # mount a file; never put the password here
  smtp_require_tls: true
route:
  receiver: ops-email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: ops-email
    email_configs:
      - to: "ops@example.org"                 # CHANGE_ME
        send_resolved: true
inhibit_rules:
  - source_matchers: [severity="critical"]    # a critical alert silences the warning for the same alertname
    target_matchers: [severity="warning"]
    equal: [alertname]
